# Local Minikube test: dev / pm groups; token MCPs exposed by loopback port-forward.
catalogueAuth:
  enabled: false
  clientId: temba
  audience: temba-mcp
  issuer: https://auth.m.space-e2bd42e8.hcp.cloudgouv-eu-west-1.numspot.com/realms/master
  jwksUri: https://auth.m.space-e2bd42e8.hcp.cloudgouv-eu-west-1.numspot.com/realms/master/protocol/openid-connect/certs
  tokenEndpoint: https://auth.m.space-e2bd42e8.hcp.cloudgouv-eu-west-1.numspot.com/realms/master/protocol/openid-connect/token
catalog:
  servers:
  - id: gitlab
    description: GitLab tools for the dev group; project and instance configured on
      the MCP server. Requires a client-provided raw GitLab token.
    endpoint: http://127.0.0.1:18082/mcp
    headers:
    - name: X-Gitlab-Token
      credential: token
      mandatory: true
    access:
      groupsAnyOf:
      - /dev

  - id: jira-token
    description: Jira support tools for the dev group; instance URL and email configured
      on the MCP server. Requires a client-provided raw Jira token.
    endpoint: http://127.0.0.1:18081/mcp
    labels:
    - support
    headers:
    - name: X-Jira-Token
      credential: token
      mandatory: true
    access:
      groupsAnyOf:
      - /dev

  - id: jira
    description: Atlassian remote Jira MCP for the pm group; sign in using its browser
      OAuth flow.
    endpoint: https://mcp.atlassian.com/v2/mcp?tools=all
    oauth:
      allowedOrigins:
      - https://auth.atlassian.com
    access:
      groupsAnyOf:
      - /pm

  - id: deepwiki
    description: Public technical documentation tools.
    endpoint: https://mcp.deepwiki.com/mcp
    timeoutSeconds: 45
    access:
      public: true

persistence:
  size: 100Mi
  storageClass: ''
security:
  allowInsecureHttp: true
