# Local migration: keep the existing Keycloak audience mapper; no custom scope.
catalogueAuth:
  enabled: true
  clientId: temba
  audience: temba-mcp
  issuer: https://auth.m.space-e2bd42e8.hcp.cloudgouv-eu-west-1.numspot.com/realms/master
  jwksUri: https://auth.m.space-e2bd42e8.hcp.cloudgouv-eu-west-1.numspot.com/realms/master/protocol/openid-connect/certs
  tokenEndpoint: https://auth.m.space-e2bd42e8.hcp.cloudgouv-eu-west-1.numspot.com/realms/master/protocol/openid-connect/token
catalog:
  servers:
    - id: jira
      name: Jira
      description: Search Jira tickets and projects through the Atlassian remote MCP
      endpoint: https://mcp.atlassian.com/v2/mcp?tools=all
      labels: [jira]
      oauth:
        allowedOrigins: [https://auth.atlassian.com]
      access:
        groupsAnyOf: ["/temba-jira"]

    - id: deepwiki
      endpoint: https://mcp.deepwiki.com/mcp
      timeoutSeconds: 45
      labels: [docs]
      access: {public: true}

persistence:
  size: 5Gi
  storageClass: ""
