{{- if and .Values.adminApi.mutable (ne (int .Values.replicaCount) 1) }}{{ fail "RAM-only admin mutations require replicaCount=1" }}{{ end }}
{{- if and .Values.adminApi.mutable (not .Values.adminApi.secretName) }}{{ fail "adminApi.mutable requires a pre-existing secretName" }}{{ end }}
{{- if and .Values.auth.enabled (or (not .Values.auth.issuer) (not .Values.auth.audience) (not .Values.auth.clientId)) }}{{ fail "auth.enabled requires issuer, audience and clientId" }}{{ end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "temba.name" . }}
  labels:
    {{- include "temba.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "temba.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "temba.labels" . | nindent 8 }}
      annotations:
        checksum/catalog: {{ toJson .Values.catalog | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: catalog
          image: {{ if .Values.image.digest }}{{ printf "%s@%s" .Values.image.repository .Values.image.digest | quote }}{{ else }}{{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}{{ end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{name: http, containerPort: 8080}]
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          env:
            - {name: CATALOG_PATH, value: /etc/temba/catalog.yaml}
            - {name: AUTH_ENABLED, value: {{ .Values.auth.enabled | quote }}}
            - {name: AUTH_ISSUER, value: {{ .Values.auth.issuer | quote }}}
            - {name: AUTH_AUDIENCE, value: {{ .Values.auth.audience | quote }}}
            - {name: AUTH_CLIENT_ID, value: {{ .Values.auth.clientId | quote }}}
            - {name: AUTH_CALLBACK_PORT, value: {{ .Values.auth.callbackPort | quote }}}
            - {name: AUTH_JWKS_URI, value: {{ .Values.auth.jwksUri | quote }}}
            - {name: AUTH_TOKEN_ENDPOINT, value: {{ .Values.auth.tokenEndpoint | quote }}}
            - {name: ALLOW_INSECURE_HTTP, value: {{ .Values.security.allowLoopbackHttp | quote }}}
            - {name: ADMIN_MUTABLE, value: {{ .Values.adminApi.mutable | quote }}}
            {{- if .Values.adminApi.secretName }}
            - name: ADMIN_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.adminApi.secretName }}
                  key: {{ .Values.adminApi.tokenKey }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe: {httpGet: {path: /readyz, port: http}}
          livenessProbe: {httpGet: {path: /healthz, port: http}}
          volumeMounts:
            - {name: catalog, mountPath: /etc/temba, readOnly: true}
      volumes:
        - name: catalog
          configMap: {name: {{ include "temba.name" . }}-catalog}
