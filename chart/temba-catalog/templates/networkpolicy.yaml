{{- if .Values.security.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "temba.name" . }}
spec:
  podSelector:
    matchLabels:
      {{- include "temba.selector" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ required "networkPolicy.ingress.namespace is required" .Values.security.networkPolicy.ingress.namespace | quote }}
          podSelector:
            {{- toYaml .Values.security.networkPolicy.ingress.podSelector | nindent 12 }}
      ports: [{protocol: TCP, port: 8080}]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    {{- if and .Values.catalogueAuth.enabled .Values.security.networkPolicy.authCidrs }}
    - to:
      {{- range .Values.security.networkPolicy.authCidrs }}
        - ipBlock: {cidr: {{ . | quote }}}
      {{- end }}
      ports: [{protocol: TCP, port: 443}]
    {{- end }}
{{- end }}
