apiVersion: v1
kind: Service
metadata:
  name: {{ include "temba.name" . }}
  labels:
    {{- include "temba.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "temba.selector" . | nindent 4 }}
  ports: [{name: http, port: {{ .Values.service.port }}, targetPort: http}]
