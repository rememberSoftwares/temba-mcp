# OAuth flows currently require one process. More replicas are rejected by the chart.
replicaCount: 1

auth:
  enabled: false # Public MCPs work without Keycloak; enable to access credentialed MCPs
  issuer: "" # Required: https://keycloak.example.com/realms/company
  audience: "temba-mcp" # Keycloak audience mapper, NOT the OpenCode client ID
  scopes: ["temba:use"]
  browserClientId: temba-login # Keycloak public client; fixed /oidc/callback, S256 PKCE
  browserClientSecretName: "" # Optional confidential client secret
  browserClientSecretKey: client-secret

security:
  allowInsecureHttp: false # Dev only: permit Temba HTTP on localhost, 127.0.0.1 or ::1; Keycloak still requires TLS
  userIdleTtl: 3600
  maxUserGateways: 128

  # Politique réseau egress : nécessite un CNI qui applique les
  # NetworkPolicy (Calico/Cilium). Internet public uniquement + MCP internes
  # déclarés ci-dessous + CIDR internes explicites (VPN...).
  networkPolicy:
    enabled: true # WARNING ! LEAVE THIS ENABLE when using `allowNewMcpRegisteringByLlm: true`
    internalMcpPods: []   # ex: [mcp-grafana, mcp-atlassian] si extra-mcp/ appliqué
    internalCidrs: []     # ex: 10.30.0.0/16 (VPN numspot pour grafana interne)

image:
  repository: python
  tag: "3.12-slim"
  pullPolicy: IfNotPresent


ingress:
  enabled: true
  className: ""
  host: ""
  tls: [] # [{secretName: temba-mcp-tls, hosts: [temba-mcp.exemple.com]}]
  annotations: {}


publicBaseUrl: "" # Derived automatically from Ingress host. Overide only for exotic usecases (ie: port-forward: 'localhost')


# Adds a third tool allowing the LLM to add new MCPs to it's own catalog.
# ie adding public Jira MCP to its capabilities even though it was not available initially.
allowNewMcpRegisteringByLlm: false


# -------------------- MCP catalog -------------------------------
# The list of remote MCP servers to expose in the catalog.
# Interpolation from k8s secrets can be done using ${VAR} and `env` section.
catalog:
  servers:
    ## Basic example ##
    #- id: deepwiki
    #  url: https://mcp.deepwiki.com/mcp

    ## OIDC example (MCP auth spec: DCR + PKCE, human login via a /auth link) ##
    #- id: atlassian-remote
    #  url: https://mcp.atlassian.com/v2/mcp?tools=all
    #  oauth: {}                # {} = dynamic client registration, no creds needed (401 => DCR => /auth login)
    ## oauth accepts one optional key:
    #  oauth: {scope: "read:jira-work read:jira-user"}

    ## String interpolation + label example (cf `env` section) ##
    # - id: grafana
    #   url: http://mcp-grafana:8000/mcp
    #   headers:
    #     Authorization: Bearer ${GRAFANA_MCP_TOKEN}
    #   labels: [grafana]  # <== Only clients sending this same label can see this the tool


# Extra pod env — standard k8s syntax (env[] / env[].valueFrom).
# Values set here can be interpolated into catalog headers via ${VAR}
# (pairs with the grafana catalog entry above).
#env:
#  - name: GRAFANA_MCP_TOKEN # interpolate in the catalog like so: ${GRAFANA_MCP_TOKEN}
#    valueFrom:
#      secretKeyRef:
#        name: temba-mcp-secrets
#        key: GRAFANA_MCP_TOKEN
env: []


# The REST API allows you to add/delete/list MCP servers to the catalog. 
adminApi:
  # Name of a pre-existing k8s Secret holding the admin API bearer token.
  # Empty (or the whole adminApi block omitted) => the chart creates `<release>-admin` with a generated token (kept across upgrades).
  secretName: # Name of the secret containing your token
  tokenKey:   # Nmae of the key holding your token


# Semantic search (recommended) via an OpenAI-compatible /v1/embeddings endpoint.
# Allows the LLM to search for tools inside the catalog.
# Empty baseUrl => local BM25 fallback.
embeddings:
  baseUrl: ""                      # e.g. https://llm.example.com/v1
  model: text-embedding-3-small
  apiKey: ""                       # literal value, or leave empty and use secretRef
  secretRef:                       # pre-existing Secret holding the API key (wins over apiKey)
    name: ""
    key: ""                        # e.g. EMBEDDINGS_API_KEY





# ---------------------- Misc ---------------------------
  

service:
  type: ClusterIP
  port: 8080
  nodePort: ""

resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { memory: 1Gi }
