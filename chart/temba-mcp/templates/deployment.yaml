apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tembamcp.fullname" . }}
  labels:
    {{- include "tembamcp.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: temba-mcp
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "tembamcp.labels" . | nindent 8 }}
        app.kubernetes.io/component: gateway
    spec:
      automountServiceAccountToken: false
      containers:
        - name: temba-mcp
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [sh, -c]
          args:
            - pip install --no-cache-dir "mcp>=2,<3" pyyaml uv rank_bm25 snowballstemmer redis && exec python /app/server.py
          workingDir: /app
          env:
            - name: REGISTRY_PATH
              value: /etc/temba-mcp/registry.yaml
            - name: PORT
              value: "8080"
            - name: LIST_TIMEOUT
              value: "90"
            - name: PUBLIC_BASE_URL
              value: {{ include "tembamcp.publicBaseUrl" . | quote }}
            - name: ADD_MCP_ENABLED
              value: {{ .Values.allowNewMcpRegisteringByLlm | ternary "true" "false" | quote }}
            - name: ADMIN_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "tembamcp.adminSecretName" . }}
                  key: {{ include "tembamcp.adminTokenKey" . }}
            - name: REDIS_URL
              value: {{ .Values.redis.url | default (printf "redis://%s-redis:6379/0" (include "tembamcp.fullname" .)) | quote }}
            {{- with .Values.embeddings }}
            {{- if .baseUrl }}
            - name: EMBEDDINGS_BASE_URL
              value: {{ .baseUrl | quote }}
            {{- end }}
            {{- if .model }}
            - name: EMBEDDINGS_MODEL
              value: {{ .model | quote }}
            {{- end }}
            {{- if .secretRef.name }}
            - name: EMBEDDINGS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .secretRef.name }}
                  key: {{ required "embeddings.secretRef.key is required with embeddings.secretRef.name" .secretRef.key }}
            {{- else if .apiKey }}
            - name: EMBEDDINGS_API_KEY
              value: {{ .apiKey | quote }}
            {{- end }}
            {{- end }}
            {{- $reserved := list "PORT" "LIST_TIMEOUT" "REGISTRY_PATH" "PUBLIC_BASE_URL" "ADD_MCP_ENABLED" "ADMIN_API_TOKEN" "REDIS_URL" "EMBEDDINGS_BASE_URL" "EMBEDDINGS_MODEL" "EMBEDDINGS_API_KEY" }}
            {{- range .Values.env }}
            {{- if has .name $reserved }}
            {{- fail (printf "env: %s is managed by the chart and cannot be overridden" .name) }}
            {{- end }}
            {{- toYaml (list .) | nindent 12 }}
            {{- end }}
          ports:
            - name: mcp
              containerPort: 8080
          startupProbe:
            tcpSocket: { port: 8080 }
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            tcpSocket: { port: 8080 }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 8080 }
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: code
              mountPath: /app
              readOnly: true
            - name: registry
              mountPath: /etc/temba-mcp
              readOnly: true
      volumes:
        - name: code
          configMap:
            name: {{ include "tembamcp.fullname" . }}-code
        - name: registry
          configMap:
            name: {{ include "tembamcp.fullname" . }}-registry
