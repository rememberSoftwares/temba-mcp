{{- if not .Values.adminApi.secretName }}
{{- $name := include "dynmcp.adminSecretName" . }}
{{- $key := include "dynmcp.adminTokenKey" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $token := "" }}
{{- if $existing }}
{{- $token = index $existing.data $key | default (randAlphaNum 32 | b64enc) }}
{{- else }}
{{- $token = randAlphaNum 32 | b64enc }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "dynmcp.labels" . | nindent 4 }}
type: Opaque
data:
  {{ $key }}: {{ $token }}
{{- end }}
