{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.name }}
  labels:
    {{- include "dynmcp.labels" . | nindent 4 }}
type: Opaque
stringData:
  # vide => valeur aléatoire régénérée à chaque `helm upgrade`
  # (les pods de la chart redémarrent en même temps, cohérence assurée ;
  #  fixer explicitement la valeur pour un token stable entre upgrades)
  GRAFANA_SERVICE_ACCOUNT_TOKEN: {{ .Values.secrets.grafanaServiceAccountToken | quote }}
  GRAFANA_MCP_TOKEN: {{ .Values.secrets.grafanaMcpToken | default (randAlphaNum 32) | quote }}
  ADMIN_API_TOKEN: {{ .Values.secrets.adminApiToken | default (randAlphaNum 32) | quote }}
{{- end }}
