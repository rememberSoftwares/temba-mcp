apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dynmcp.fullname" . }}-registry
  labels:
    {{- include "dynmcp.labels" . | nindent 4 }}
data:
  registry.yaml: |
    # Registry des MCP agrégés par le gateway (infra as code).
    # Transport HTTP uniquement ; les ${VARS} sont interpolées depuis l'env du pod.
    servers:
{{ toYaml .Values.registry.servers | indent 6 }}
