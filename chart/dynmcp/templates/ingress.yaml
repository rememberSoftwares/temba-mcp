{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "dynmcp.fullname" . }}
  labels:
    {{- include "dynmcp.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # /mcp : agents (S2S) — /auth, /oauth/callback, /servers : humains/admin
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "dynmcp.fullname" . }}
                port:
                  name: mcp
{{- end }}
