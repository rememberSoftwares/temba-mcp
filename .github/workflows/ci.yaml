name: Checks, images, binaries and releases
on:
  push:
    branches: ['**']
    tags: ['[0-9]*.[0-9]*.[0-9]*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  RUST_TOOLCHAIN: "1.99.1"
jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify required CI scripts are committed
        run: git ls-files --error-unmatch LICENSE scripts/package_client_release.py scripts/test_release.py scripts/check_chart.py scripts/build_chart_repository.py scripts/test_chart_repository.py crates/temba-client/tests/fixtures/stdio_mcp.py
      - name: Validate version and release tag
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: python scripts/package_client_release.py check-version
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: python -m unittest discover -s scripts -p 'test_release.py'
      - uses: azure/setup-helm@v5
      - run: helm lint chart/temba-catalog
      - run: python3 scripts/check_chart.py
      - name: Verify chart packaging
        run: helm package chart/temba-catalog --destination "${RUNNER_TEMP}/chart-package"
      - run: python -m unittest discover -s scripts -p 'test_chart_repository.py'
  wheels:
    needs: rust
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, target: x86_64-unknown-linux-gnu}
          - {os: macos-15, target: aarch64-apple-darwin}
          - {os: macos-15-intel, target: x86_64-apple-darwin}
          - {os: windows-latest, target: x86_64-pc-windows-msvc}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Rust for this platform
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - uses: astral-sh/setup-uv@v7
      - name: Install Windows assembler
        if: runner.os == 'Windows'
        run: choco install nasm --no-progress -y
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --locked --out dist
          manylinux: auto
          rust-toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Test wheel through uvx
        shell: bash
        run: |
          uvx --offline --from "$(find dist -name '*.whl' -print -quit)" temba --help
      - name: Package and test native executable
        env:
          TARGET: ${{ matrix.target }}
        run: python scripts/package_client_release.py package --target "$TARGET"
        shell: bash
      - uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error
  catalog-image:
    needs: rust
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    concurrency:
      group: catalog-image-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate catalog version and prepare image name
        id: image
        env:
          IMAGE_OWNER: ${{ github.repository_owner }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path
          import sys

          sys.path.insert(0, 'scripts')
          from package_client_release import client_version

          version = tomllib.loads(Path('crates/temba-catalog/Cargo.toml').read_text())['package']['version']
          release_version = client_version()
          chart = Path('chart/temba-catalog/Chart.yaml').read_text()
          values = Path('chart/temba-catalog/values.yaml').read_text()
          for name, text, pattern in [
              ('chart appVersion', chart, r'^appVersion: "([^"]+)"$'),
          ]:
              match = re.search(pattern, text, re.MULTILINE)
              if not match or match[1] != version:
                  raise SystemExit(f'{name} must match catalog version {version}')
          chart_version = re.search(r'^version: (.+)$', chart, re.MULTILINE)
          if not chart_version or chart_version[1] != release_version:
              raise SystemExit(f'Chart version must match release version {release_version}')
          image_tag = re.search(r'^  tag: "([^"]+)"$', values, re.MULTILINE)
          if not image_tag or image_tag[1] != release_version:
              raise SystemExit(f'Chart image tag must match release version {release_version}')
          image = f"ghcr.io/{os.environ['IMAGE_OWNER'].lower()}/temba-catalog"
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f'tag={image}:{release_version}', file=output)
          PY
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build catalog image and publish release tags
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
          tags: ${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=catalog-image
          cache-to: type=gha,mode=max,scope=catalog-image
  release:
    if: github.ref_type == 'tag'
    needs: [rust, wheels, catalog-image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Verify assets and generate checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/package_client_release.py checksums
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json; then
            if [ "$(python -c 'import json; print(json.load(open("release-state.json"))["isDraft"])')" != "True" ]; then
              echo "Release is already published; leaving its assets unchanged."
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "Temba $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false
  chart-repository:
    if: github.ref_type == 'tag'
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pages: write
      id-token: write
    concurrency:
      group: helm-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: azure/setup-helm@v5
      - name: Package and attach chart to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir chart-assets
          cp LICENSE chart/temba-catalog/LICENSE
          helm package chart/temba-catalog --destination chart-assets
          archive="temba-catalog-${RELEASE_TAG}.tgz"
          test -f "chart-assets/$archive"
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' > existing-assets.txt
          if ! grep -Fxq "$archive" existing-assets.txt; then
            gh release upload "$RELEASE_TAG" "chart-assets/$archive"
          fi
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build Helm repository with all released charts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: python scripts/build_chart_repository.py --url "$PAGES_URL" --output helm-repository
      - uses: actions/upload-pages-artifact@v3
        with:
          path: helm-repository
      - name: Deploy Helm repository
        id: deployment
        uses: actions/deploy-pages@v4
