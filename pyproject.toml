[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "temba-client"
version = "2.4.1"
description = "Local Rust MCP client with RAM-only OAuth sessions"
requires-python = ">=3.9"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_LICENSES"]

[tool.maturin]
manifest-path = "crates/temba-client/Cargo.toml"
bindings = "bin"
strip = true
