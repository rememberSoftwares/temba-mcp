[workspace]
members = ["crates/temba-core", "crates/temba-client", "crates/temba-catalog"]
resolver = "3"

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "form"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
url = { version = "2", features = ["serde"] }
zeroize = { version = "1", features = ["derive"] }
temba-core = { path = "crates/temba-core" }

[profile.release]
lto = "thin"
strip = true

