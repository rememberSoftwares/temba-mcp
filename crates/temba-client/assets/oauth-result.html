<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}} · Temba</title>
  <style>
    :root { color-scheme: light dark; --bg: #f5f6f8; --card: #fff; --ink: #172130; --muted: #667085; --line: #e6e9ef; --accent: #16715b; --soft: #eaf6f1; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 32px 20px; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: min(100%, 460px); }
    .brand { display: flex; align-items: center; justify-content: center; gap: 11px; margin-bottom: 32px; }
    .mark { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 12px; background: var(--ink); color: var(--card); }
    .brand-name { font-size: 28px; font-weight: 650; letter-spacing: -1px; }
    .card { padding: 40px 32px 32px; text-align: center; border: 1px solid var(--line); border-radius: 24px; background: var(--card); box-shadow: 0 12px 40px #17213008; }
    .status { margin: 0 auto 24px; width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; background: var(--soft); color: var(--accent); }
    .error { --accent: #a14d29; --soft: #fff2e9; }
    .eyebrow { margin: 0 0 12px; color: var(--muted); font-size: 11px; letter-spacing: 1.8px; font-weight: 650; text-transform: uppercase; }
    h1 { margin: 0 0 16px; font-size: clamp(24px, 5vw, 28px); line-height: 1.2; letter-spacing: -.7px; font-weight: 650; }
    .message { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.7; }
    .next { margin: 28px 0 0; padding-top: 24px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }
    footer { margin-top: 24px; text-align: center; color: var(--muted); font-size: 12px; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #10151c; --card: #19212c; --ink: #edf2f8; --muted: #a6b1c0; --line: #2d3745; --accent: #82d7b3; --soft: #203a32; }
      .error { --accent: #edb394; --soft: #3a2a24; }
    }
    @media (max-width: 380px) { .card { padding: 32px 24px 28px; } }
  </style>
</head>
<body>
  <main>
    <div class="brand" aria-label="Temba">
      <span class="mark" aria-hidden="true"><svg width="23" height="23" viewBox="0 0 24 24" fill="none"><path d="M5 6h14M12 6v13" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><circle cx="5" cy="6" r="2.5" fill="currentColor"/><circle cx="19" cy="6" r="2.5" fill="currentColor"/><circle cx="12" cy="19" r="2.5" fill="currentColor"/></svg></span>
      <span class="brand-name">Temba</span>
    </div>
    <section class="card {{CLASS}}" aria-labelledby="title">
      <div class="status" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">{{ICON}}</svg></div>
      <p class="eyebrow">Authentication</p>
      <h1 id="title">{{TITLE}}</h1>
      <p class="message">{{MESSAGE}}</p>
      <p class="next">You can close this tab.</p>
    </section>
    <footer>MCP connections, made simple.</footer>
  </main>
</body>
</html>
