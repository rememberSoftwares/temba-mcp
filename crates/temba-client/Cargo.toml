[package]
name = "temba-client"
version = "2.4.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "temba"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
url.workspace = true
zeroize.workspace = true
temba-core.workspace = true
rmcp = { version = "=3.5.1", default-features = false, features = ["client", "server", "reqwest", "transport-io", "transport-streamable-http-client-reqwest", "which-command", "transport-streamable-http-server"] }
open = "5"
serde_yaml_ng = "0.10"
serde_path_to_error = "0.1"
uuid = { version = "1", features = ["v4"] }
futures = "0.3"
tokio-util = { version = "0.7", features = ["rt"] }
process-wrap = { version = "10.0", features = ["tokio1"] }
rpassword = "7"


sha2 = "0.10"
base64 = "0.22"
http = "1"
sse-stream = "0.2.4"

getrandom = "0.4"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
