apiVersion: v1
kind: ConfigMap
metadata:
  name: dynmcp-registry
  labels:
    app: dynmcp
data:
  registry.yaml: |
    # Registry des MCP agrégés par le gateway (infra as code).
    # Transport HTTP uniquement ; les ${VARS} sont interpolées depuis l'env du pod.
    servers:
      # Documentation technique (public, streamable HTTP)
      - id: deepwiki
        transport: http
        url: https://mcp.deepwiki.com/mcp
        # timeout: 30   # secondes, optionnel — override LIST_TIMEOUT/CALL_TIMEOUT pour ce serveur

      # Grafana MCP déployé à côté (k8s/grafana.yaml), joint en HTTP avec bearer token
      - id: grafana
        transport: http
        url: http://mcp-grafana:8000/mcp
        headers:
          Authorization: Bearer ${GRAFANA_MCP_TOKEN}

      # Atlassian MCP déployé à côté (k8s/atlassian.yaml), joint en HTTP
      - id: atlassian
        transport: http
        url: http://mcp-atlassian:8000/mcp
