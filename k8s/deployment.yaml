apiVersion: apps/v1
kind: Deployment
metadata:
  name: dynmcp
  labels:
    app: dynmcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dynmcp
  template:
    metadata:
      labels:
        app: dynmcp
    spec:
      # Le gateway n'utilise jamais l'API k8s : on retire le token SA du pod
      # pour réduire la surface si un SSRF passait la garde applicative.
      automountServiceAccountToken: false
      containers:
        - name: dynmcp
          # Pas d'image custom : image générique + code monté depuis la ConfigMap.
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          command: [sh, -c]
          args:
            - pip install --no-cache-dir "mcp>=2,<3" pyyaml uv rank_bm25 snowballstemmer && exec python /app/server.py
          workingDir: /app
          env:
            - name: REGISTRY_PATH
              value: /etc/dynmcp/registry.yaml
            - name: PORT
              value: "8080"
            # Cold-start uvx (téléchargement mcp-grafana) => handshake long
            - name: LIST_TIMEOUT
              value: "90"
            - name: GRAFANA_SERVICE_ACCOUNT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: dynmcp-secrets
                  key: GRAFANA_SERVICE_ACCOUNT_TOKEN
            - name: GRAFANA_MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: dynmcp-secrets
                  key: GRAFANA_MCP_TOKEN
            # OAuth dynamique : URL publique du gateway (callback /oauth/callback).
            # Doit être joignable par le navigateur de l'utilisateur.
            # - port-forward local : http://localhost:18080
            # - vrai déploiement  : https://dynmcp.mon-club.io
            - name: PUBLIC_BASE_URL
              value: http://localhost:18080
            # Persistance des tokens OAuth + serveurs dynamiques (emptyDir =>
            # survit au crash du container, pas à la suppression du pod ; un PVC
            # en production)
            - name: TOKENS_PATH
              value: /data/tokens.json
            - name: DYNAMIC_REGISTRY_PATH
              value: /data/dynamic-servers.json
            # API admin /servers (ajout/suppression/liste de MCP partagés) :
            # token en bearer, distribué hors LLM. Vide = API désactivée.
            - name: ADMIN_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: dynmcp-secrets
                  key: ADMIN_API_TOKEN
            # Tool add_mcp (LLM auto-extension) : désactivé par défaut.
            # Passer à "1" pour que le gateway expose add_mcp aux agents.
            - name: ADD_MCP_ENABLED
              value: "1"
            # Index sémantique optionnel : renseigner pour activer les embeddings
            # (endpoint OpenAI-compatible). Sinon fallback BM25 local automatique.
            # - name: EMBEDDINGS_BASE_URL
            #   value: https://newapi.numspot.tech/v1
            # - name: EMBEDDINGS_API_KEY
            #   valueFrom:
            #     secretKeyRef:
            #       name: dynmcp-secrets
            #       key: EMBEDDINGS_API_KEY
            # - name: EMBEDDINGS_MODEL
            #   value: text-embedding-3-small
          ports:
            - name: mcp
              containerPort: 8080
          # pip install au boot => démarrage lent, d'où la startupProbe généreuse.
          startupProbe:
            tcpSocket: { port: 8080 }
            periodSeconds: 5
            failureThreshold: 36   # 3 min max pour le pip install
          readinessProbe:
            tcpSocket: { port: 8080 }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 8080 }
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: code
              mountPath: /app
              readOnly: true
            - name: registry
              mountPath: /etc/dynmcp
              readOnly: true
            - name: uv-cache
              mountPath: /root/.cache/uv
            - name: oauth-tokens
              mountPath: /data
      volumes:
        - name: code
          configMap:
            name: dynmcp-code
        - name: registry
          configMap:
            name: dynmcp-registry
        - name: uv-cache
          emptyDir: {}
        - name: oauth-tokens
          emptyDir: {}
